name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Check Code Formatting
        run: uv run ruff format --check .

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Type Checking
        run: uv run pyright

      - name: Run Test Suite
        run: uv run pytest
