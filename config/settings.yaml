# Configuration for Dokkan Battle Automation Bot

device:
  serial: "" # Leave blank to auto-detect the first connected device
  package_name: "com.bandainamcogames.dbzdokkanww" # Global Dokkan package
  scrcpy_path: "scrcpy"
  adb_path: "adb"

vision:
  confidence_threshold: 0.78
  template_dir: "templates/glb"
  debug_save_screens: false # Save unrecognized screens for debugging/template creation

bot:
  loop_delay: 1.5 # Seconds between screen state evaluations
  tap_delay: 0.8 # Delay after sending a tap input
  max_unknown_screens: 15 # Warn if screen is unrecognized for consecutive cycles
  auto_restart_app: true # Relaunch Dokkan if not running

farming:
  stamina_refill_mode: "meat" # "none", "meat", "stones"
  friend_selection_mode: "refresh" # "refresh" (auto-assigns friend via refresh button)
  friend_refresh_coords: [0.82, 0.18] # (rx, ry) for refresh/auto-assign button on friend screen
  default_runs: 20
  eza_target_level: 999 # Scalata fino al livello massimo 999

link_leveling:
  auto_swap_maxed_units: true # Automatically replace units that hit max link level (Lv. 10)
  protected_slots: [] # Empty list = all slots (including Leader) can be replaced!
  box_first_slot_coords: [0.18, 0.28] # (rx, ry) for first card in filtered character box
  box_confirm_coords: [0.50, 0.90] # (rx, ry) for confirm button in character box


discord:
  token: "" # Paste your Discord bot token here
  channel_id: 0 # Default channel to send alerts & screenshots
  allowed_user_ids: [] # Discord user IDs allowed to run commands (empty = anyone in channel)
