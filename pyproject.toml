[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dokkan-eza-link-farmer"
version = "1.0.3"
description = "Specialized endgame automation for DBZ Dokkan Battle - Extreme Z-Battle (EZA 999 Zeni) & Chamber of Spirit and Time Link Leveling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dokkan-EZALink-Farmer Contributors" }
]
keywords = ["dokkan-battle", "eza-farm", "link-leveling", "zeni-farm", "automation", "adb", "computer-vision", "discord-bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "discord.py>=2.3.0",
    "opencv-python-headless>=4.8.0",
    "requests>=2.28.0",
    "questionary>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "pyinstaller>=6.0.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
Launch-Dokkan-EZALink = "main:main"
dokkan-eza-link = "main:main"
dokkan-farmer = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "tasks", "interfaces", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config" = "config"
"locales" = "locales"
"templates" = "templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "tasks", "interfaces", "tools"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["core", "tasks", "interfaces", "tools", "main.py"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
