[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dokkan-eza-link-farmer"
version = "v1.0.4"
description = "Specialized endgame automation for DBZ Dokkan Battle - Extreme Z-Battle (EZA 999 Zeni) & Chamber of Spirit and Time Link Leveling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "SolaneHub" }
]
keywords = ["dokkan-battle", "eza-farm", "link-leveling", "zeni-farm", "automation", "adb", "computer-vision", "discord-bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "discord.py>=2.3.0",
    "opencv-python-headless>=4.8.0",
    "requests>=2.28.0",
    "questionary>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]

[project.scripts]
Launch-Dokkan-EZALink = "dokkan_eza_link_farmer.__main__:main"
dokkan-eza-link = "dokkan_eza_link_farmer.__main__:main"
dokkan-farmer = "dokkan_eza_link_farmer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dokkan_eza_link_farmer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # Line length (handled by formatter)
    "B008", # Do not perform function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["dokkan_eza_link_farmer"]

[tool.pyright]
include = ["src", "main.py", "build_exe.py", "scripts", "tools", "tests"]
extraPaths = ["src"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
]
pythonVersion = "3.10"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
