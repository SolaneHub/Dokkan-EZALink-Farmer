<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 152" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#34d399" />
    </marker>

    <style>
      .txt-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono-font { font-family: "JetBrains Mono", Consolas, "Liberation Mono", monospace; }

      .flow-line {
        stroke: #0284c7;
        stroke-width: 1.4;
        stroke-dasharray: 4 3;
        animation: flowPulse 0.9s linear infinite;
      }
      .flow-success {
        stroke: #059669;
        stroke-width: 1.4;
        stroke-dasharray: 4 3;
        animation: flowPulse 0.9s linear infinite;
      }

      @keyframes flowPulse {
        to { stroke-dashoffset: -14; }
      }

      @keyframes readyGlow {
        0%, 100% { stroke: #059669; }
        50% { stroke: #34d399; }
      }
      .glow-ready {
        animation: readyGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="780" height="152" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(22, 16)">
    <!-- Pulse dot -->
    <circle cx="5" cy="9" r="3" fill="#38bdf8" />
    <circle cx="5" cy="9" r="6" fill="#38bdf8" opacity="0.25">
      <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="12.5" class="txt-font" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">5-TIER RESOLUTION PIPELINE</text>
    <text x="736" y="12.5" text-anchor="end" class="txt-font" font-size="9" fill="#64748b">Windows • macOS • Linux</text>
  </g>

  <!-- ==================== CONNECTING FLOW BEAMS ==================== -->
  <line x1="128" y1="71" x2="145" y2="71" class="flow-line" marker-end="url(#arrowCyan)" />
  <line x1="254" y1="71" x2="271" y2="71" class="flow-line" marker-end="url(#arrowCyan)" />
  <line x1="380" y1="71" x2="397" y2="71" class="flow-line" marker-end="url(#arrowCyan)" />
  <line x1="506" y1="71" x2="523" y2="71" class="flow-line" marker-end="url(#arrowCyan)" />
  <line x1="632" y1="71" x2="649" y2="71" class="flow-success" marker-end="url(#arrowGreen)" />

  <!-- ==================== TIER 1: CONFIG ==================== -->
  <g transform="translate(22, 42)">
    <rect width="106" height="58" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <rect x="7" y="7" width="18" height="13" rx="3" fill="#0284c7" fill-opacity="0.25" />
    <text x="16" y="17" text-anchor="middle" class="mono-font" font-size="8.5" font-weight="700" fill="#38bdf8">01</text>
    <text x="31" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#f8fafc">Config</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8.5" fill="#38bdf8">settings.yaml</text>
  </g>

  <!-- ==================== TIER 2: ENV ==================== -->
  <g transform="translate(148, 42)">
    <rect width="106" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="7" y="7" width="18" height="13" rx="3" fill="#1e293b" />
    <text x="16" y="17" text-anchor="middle" class="mono-font" font-size="8.5" font-weight="700" fill="#94a3b8">02</text>
    <text x="31" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#f8fafc">Env Vars</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8.2" fill="#94a3b8">SCRCPY_PATH</text>
  </g>

  <!-- ==================== TIER 3: SYSTEM PATH ==================== -->
  <g transform="translate(274, 42)">
    <rect width="106" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="7" y="7" width="18" height="13" rx="3" fill="#1e293b" />
    <text x="16" y="17" text-anchor="middle" class="mono-font" font-size="8.5" font-weight="700" fill="#94a3b8">03</text>
    <text x="31" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#f8fafc">Sys PATH</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8" fill="#94a3b8">PATH • WinReg</text>
  </g>

  <!-- ==================== TIER 4: PACKAGES ==================== -->
  <g transform="translate(400, 42)">
    <rect width="106" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="7" y="7" width="18" height="13" rx="3" fill="#1e293b" />
    <text x="16" y="17" text-anchor="middle" class="mono-font" font-size="8.5" font-weight="700" fill="#94a3b8">04</text>
    <text x="31" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#f8fafc">Packages</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8" fill="#94a3b8">brew • winget</text>
  </g>

  <!-- ==================== TIER 5: HEURISTIC ==================== -->
  <g transform="translate(526, 42)">
    <rect width="106" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="7" y="7" width="18" height="13" rx="3" fill="#1e293b" />
    <text x="16" y="17" text-anchor="middle" class="mono-font" font-size="8.5" font-weight="700" fill="#94a3b8">05</text>
    <text x="31" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#f8fafc">Heuristic</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8" fill="#94a3b8">~/Downloads</text>
  </g>

  <!-- ==================== RESOLVED NODE ==================== -->
  <g transform="translate(652, 42)">
    <rect width="106" height="58" rx="6" fill="#022c22" fill-opacity="0.6" stroke="#059669" stroke-width="1.3" class="glow-ready" />
    <circle cx="16" cy="13.5" r="5.5" fill="#059669" fill-opacity="0.3" />
    <text x="16" y="16.5" text-anchor="middle" class="txt-font" font-size="9" font-weight="800" fill="#34d399">✓</text>
    <text x="29" y="17.5" class="txt-font" font-size="10" font-weight="700" fill="#34d399">Resolved</text>
    <rect x="7" y="27" width="92" height="23" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
    <text x="53" y="42" text-anchor="middle" class="mono-font" font-size="8" font-weight="600" fill="#a7f3d0">Cache + Co-loc</text>
  </g>

  <!-- ==================== FOOTER BADGES ==================== -->
  <!-- Capsule 1: Memory Cache -->
  <g transform="translate(22, 116)">
    <rect width="176" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="13" cy="11" r="2.5" fill="#34d399" />
    <text x="22" y="14.5" class="txt-font" font-size="8.5" fill="#94a3b8">⚡ O(1) Memory Cache</text>
  </g>

  <!-- Capsule 2: Cross-Discovery -->
  <g transform="translate(210, 116)">
    <rect width="324" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="13" cy="11" r="2.5" fill="#c084fc" />
    <text x="22" y="14.5" class="txt-font" font-size="8.5" fill="#94a3b8">⇄ Cross-Discovery &amp; Co-location (scrcpy ↔ adb)</text>
  </g>

  <!-- Capsule 3: Fallback -->
  <g transform="translate(546, 116)">
    <rect width="212" height="22" rx="11" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="13" cy="11" r="2.5" fill="#f87171" />
    <text x="22" y="14.5" class="txt-font" font-size="8.5" fill="#94a3b8">✗ If absent ➔ doctor CLI guidance</text>
  </g>
</svg>
