# Configuration for Dokkan Battle Automation Bot

# UI Language: "en" (English, default) or "it" (Italian)
language: "en"

device:
  serial: "" # Leave blank to auto-detect the first connected device
  package_name: "com.bandainamcogames.dbzdokkanww" # Global Dokkan package
  scrcpy_path: "scrcpy"
  adb_path: "adb"

vision:
  confidence_threshold: 0.78
  template_dir: "templates/glb"
  debug_save_screens: false # Save unrecognized screens for debugging/template creation

bot:
  loop_delay: 1.5 # Seconds between screen state evaluations
  tap_delay: 0.8 # Delay after sending a tap input
  max_unknown_screens: 15 # Warn if screen is unrecognized for consecutive cycles
  auto_restart_app: true # Relaunch Dokkan if not running

farming:
  stamina_refill_mode: "none" # "none", "meat", "stones"
  friend_selection_mode: "refresh" # "refresh" (auto-assigns friend via refresh button)
  friend_refresh_coords: [0.82, 0.18] # (rx, ry) for refresh/auto-assign button on friend screen
  eza_target_level: 999 # Continuous climbing up to max level 999

link_leveling:
  target_event: "spirit_and_time" # "spirit_and_time" (Chamber of Spirit and Time / Stanza dello Spirito e del Tempo)
  target_stage: "saiyan_training" # Target stage: "saiyan_training" (1. Saiyan Training / Allenamento Saiyan)
  preferred_difficulty: "super" # Difficulty: "super" (40 STA)
  use_boost: false # Flag: true to use Boost when available, false to keep Boost OFF
  rebuild_team_every_run: true # If true, removes all cards and inserts top 6 cards (Released + Level Up Possible) before every stage start
  ensure_filter_every_run: false # If false, verifies filter on screen and only opens filter dialog if missing; if true, re-opens filter dialog every run
  protected_slots: [] # Empty list = all slots (including Leader) can be replaced!
  box_confirm_coords: [0.88, 0.88] # (rx, ry) for modern red confirm button in team formation
  use_attempt_again: true # If true, taps 'Attempt Again' on stage clear screen to loop directly via team management

discord:
  token: "" # Paste your Discord bot token here
  channel_id: 0 # Default channel to send alerts & screenshots
  allowed_user_ids: [] # Discord user IDs allowed to run commands (empty = anyone in channel)
